name: tests

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  unit-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run deterministic tests
        run: ./scripts/test.sh
