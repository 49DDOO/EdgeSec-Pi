<!--
  ═══════════════════════════════════════════════════════════════════
  default/agent.conf — OS-agnostic baseline
  ═══════════════════════════════════════════════════════════════════
  This config is applied to EVERY agent regardless of platform.
  Wazuh's `default` group is implicit — every enrolled agent is in it.

  KEEP IT OS-AGNOSTIC. Anything with filesystem paths or platform-
  specific log sources belongs in macos/linux/windows agent.conf.

  Pushed by:  wazuh-stack/agent-groups/setup-agent-groups.sh
  Lands at:   /var/ossec/etc/shared/default/agent.conf  (inside manager)
-->
<agent_config>

  <!-- ── Rootcheck ─────────────────────────────────────────────────
       Rootkit detection, hidden processes, suspicious binaries.
       Default cadence (every 12h) is fine; we just make sure all
       sub-checks are explicitly enabled in case upstream defaults drift.
  -->
  <rootcheck>
    <disabled>no</disabled>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_dev>yes</check_dev>
    <check_sys>yes</check_sys>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_if>yes</check_if>
    <frequency>43200</frequency>
    <skip_nfs>yes</skip_nfs>
  </rootcheck>

  <!-- ── SCA (Security Configuration Assessment) ────────────────────
       CIS / OS-hardening baseline checks. Wazuh ships per-OS policy
       files in /var/ossec/ruleset/sca/ and auto-loads the right one
       for the agent's detected OS — no path config needed here.
  -->
  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
    <skip_nfs>yes</skip_nfs>
  </sca>

  <!-- ── Syscollector (inventory) ───────────────────────────────────
       Collects packages / processes / open ports / hardware every
       hour. Feeds the Vulnerability Detector on the manager so we
       get CVE alerts automatically without any extra config.
  -->
  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports all="no">yes</ports>
    <processes>yes</processes>
    <hotfixes>yes</hotfixes>
  </wodle>

  <!-- ── Active response: enable the standard firewall-drop binary ──
       This just declares the agent CAN run the binary; the manager
       still has to send the command. Our bridge does that via
       /active-response/block-ip → wazuh.block_ip().
  -->
  <active-response>
    <disabled>no</disabled>
  </active-response>

</agent_config>
