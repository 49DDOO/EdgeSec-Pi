<!--
  ═══════════════════════════════════════════════════════════════════
  linux/agent.conf — Linux-only configuration
  ═══════════════════════════════════════════════════════════════════
  Applied ONLY to agents whose detected OS == "Linux".
  Covers Debian/Ubuntu (auth.log, apt history) AND RHEL/CentOS/Fedora
  (secure, dnf.rpm.log). Listing both is safe — Wazuh silently skips
  any localfile whose path doesn't exist on the host.

  Pushed by:  wazuh-stack/agent-groups/setup-agent-groups.sh
  Lands at:   /var/ossec/etc/shared/linux/agent.conf  (inside manager)
-->
<agent_config os="Linux">

  <!-- ── FIM watch points (Linux file system layout) ───────────── -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>

    <!-- System config — realtime, deep -->
    <directories check_all="yes" report_changes="yes" realtime="yes">/etc</directories>
    <directories check_all="yes" realtime="yes">/usr/bin,/usr/sbin,/bin,/sbin</directories>
    <directories check_all="yes" realtime="yes">/usr/local/bin,/usr/local/sbin</directories>

    <!-- Boot artifacts — common rootkit / persistence target -->
    <directories check_all="yes" realtime="yes">/boot</directories>

    <!-- Root home — anyone modifying root's .bashrc / .ssh is a flag -->
    <directories check_all="yes" realtime="yes">/root</directories>

    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/resolv.conf</ignore>
    <ignore type="sregex">^/etc/.*\.swp$</ignore>
  </syscheck>

  <!-- ════════════════════════════════════════════════════════════
       Authentication & system logs.
       Debian-family writes /var/log/auth.log; RHEL-family writes
       /var/log/secure. Listing both is harmless.
       ════════════════════════════════════════════════════════════ -->

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/secure</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/messages</location>
  </localfile>

  <!-- Kernel ring buffer (dmesg) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/kern.log</location>
  </localfile>

  <!-- ════════════════════════════════════════════════════════════
       Linux audit framework (auditd). Required for process exec /
       syscall tracking; only fires if auditd is installed + running.
       ════════════════════════════════════════════════════════════ -->

  <localfile>
    <log_format>audit</log_format>
    <location>/var/log/audit/audit.log</location>
  </localfile>

  <!-- ════════════════════════════════════════════════════════════
       Package manager operations — covers install/upgrade/remove
       history for the two main families.
       ════════════════════════════════════════════════════════════ -->

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/apt/history.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/dpkg.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/dnf.rpm.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/yum.log</location>
  </localfile>

  <!-- ════════════════════════════════════════════════════════════
       Docker daemon (when configured with `"log-driver": "json-file"`
       and the default location). On systemd hosts you may instead
       want to read journalctl — see commented block below.
       ════════════════════════════════════════════════════════════ -->

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/docker.log</location>
  </localfile>

  <!--
       NOTE: If the host instead emits docker engine logs to journald
       (typical on systemd distros), replace the localfile above with a
       command-based collector that runs `journalctl -u docker`. Wazuh
       does not parse XML comments containing two consecutive dashes,
       so the example block is intentionally NOT inlined here.
  -->

  <!-- ════════════════════════════════════════════════════════════
       Cron job operations (root-owned cron is a persistence vector).
       ════════════════════════════════════════════════════════════ -->

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/cron.log</location>
  </localfile>

  <!-- ════════════════════════════════════════════════════════════
       主動掃描 — 命令輸出當 log。
       ════════════════════════════════════════════════════════════ -->

  <localfile>
    <log_format>full_command</log_format>
    <command>ss -tlnp 2>/dev/null || netstat -tlnp 2>/dev/null</command>
    <frequency>300</frequency>
    <alias>listening-ports</alias>
  </localfile>

  <localfile>
    <log_format>full_command</log_format>
    <command>who</command>
    <frequency>60</frequency>
    <alias>active-users</alias>
  </localfile>

  <localfile>
    <log_format>full_command</log_format>
    <command>last -30 -F</command>
    <frequency>300</frequency>
    <alias>recent-logins</alias>
  </localfile>

</agent_config>
