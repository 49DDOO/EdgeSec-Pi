<!--
  ═══════════════════════════════════════════════════════════════════
  macos/agent.conf — macOS-only configuration
  ═══════════════════════════════════════════════════════════════════
  Applied ONLY to agents whose detected OS == "Darwin".
  Adds FIM watch points, classic /var/log/ sources, Homebrew operation
  log, Docker Desktop log, and a filtered Unified Logging stream for
  the macOS security-critical processes.

  Pushed by:  wazuh-stack/agent-groups/setup-agent-groups.sh
  Lands at:   /var/ossec/etc/shared/macos/agent.conf  (inside manager)
-->
<agent_config os="Darwin">

  <!-- ── FIM watch points (macOS file system layout) ───────────── -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>

    <!-- System config — realtime, deep -->
    <directories check_all="yes" report_changes="yes" realtime="yes">/etc</directories>
    <directories check_all="yes" realtime="yes">/usr/bin,/usr/sbin,/bin,/sbin</directories>
    <directories check_all="yes" realtime="yes">/usr/local/bin,/opt/homebrew/bin</directories>

    <!-- Apps — surface-level only (recursion_level=0) to avoid noise -->
    <directories check_all="yes" recursion_level="1">/Applications</directories>

    <!-- LaunchDaemons / LaunchAgents — common persistence vector -->
    <directories check_all="yes" realtime="yes">/Library/LaunchDaemons</directories>
    <directories check_all="yes" realtime="yes">/Library/LaunchAgents</directories>

    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore type="sregex">^/etc/.*\.swp$</ignore>
    <ignore type="sregex">^/etc/cups/.*$</ignore>
  </syscheck>

  <!-- ════════════════════════════════════════════════════════════
       Classic /var/log/ sources (still useful on macOS for the
       handful of programs that still write here).
       ════════════════════════════════════════════════════════════ -->

  <!-- 套件 / 系統升級 / 應用程式安裝 -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/install.log</location>
  </localfile>

  <!-- 系統 log (kernel panic, 異常服務) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/system.log</location>
  </localfile>

  <!-- WiFi 連接事件 (含 SSID / BSSID 變化) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/wifi.log</location>
  </localfile>

  <!-- Homebrew 套件操作（每套件一個 install.log，glob 模式） -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/Users/*/Library/Logs/Homebrew/*/install.log</location>
  </localfile>

  <!-- Docker Desktop log -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/Users/*/Library/Containers/com.docker.docker/Data/log/host/docker.log</location>
  </localfile>

  <!-- ════════════════════════════════════════════════════════════
       Unified Logging stream (macOS 10.12+).
       Filtered by NSPredicate to security-critical processes only,
       which keeps event rate manageable (~tens/sec vs ~thousands/sec
       unfiltered). Wazuh agent re-emits these as syslog lines.
       ════════════════════════════════════════════════════════════ -->

  <localfile>
    <log_format>macos</log_format>
    <location>macos</location>
    <query type="trace" level="info">
      process == "sudo"
        OR process == "sshd"
        OR process == "loginwindow"
        OR process == "authd"
        OR process == "tccd"
        OR process == "syspolicyd"
        OR (process == "opendirectoryd" AND
            (eventMessage CONTAINS "Failed"
              OR eventMessage CONTAINS "Successful SecureToken"
              OR eventMessage CONTAINS "Authentication denied"))
    </query>
  </localfile>

  <!-- ════════════════════════════════════════════════════════════
       主動掃描 — 命令輸出當 log。
       Lets us trend-detect open ports / logged-in users / containers
       even when no native log event fires. These produce alerts only
       if a custom rule matches (see ruleset/rules/local_rules.xml).
       ════════════════════════════════════════════════════════════ -->

  <localfile>
    <log_format>full_command</log_format>
    <command>lsof -iTCP -sTCP:LISTEN -P -n -F pn</command>
    <frequency>300</frequency>
    <alias>listening-ports</alias>
  </localfile>

  <localfile>
    <log_format>full_command</log_format>
    <command>who</command>
    <frequency>60</frequency>
    <alias>active-users</alias>
  </localfile>

  <localfile>
    <log_format>full_command</log_format>
    <command>/usr/local/bin/docker ps -a --format "{{.Names}}|{{.Status}}|{{.Image}}|{{.Ports}}" 2>/dev/null || /opt/homebrew/bin/docker ps -a --format "{{.Names}}|{{.Status}}|{{.Image}}|{{.Ports}}" 2>/dev/null</command>
    <frequency>300</frequency>
    <alias>docker-containers</alias>
  </localfile>

</agent_config>
