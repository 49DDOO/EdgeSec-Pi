<!--
  ═══════════════════════════════════════════════════════════════════
  windows/agent.conf — Windows-only configuration
  ═══════════════════════════════════════════════════════════════════
  Applied ONLY to agents whose detected OS == "windows".
  Reads the main Windows Event Logs via the "eventchannel" format,
  which is the modern XML-based API (preferred over legacy "eventlog").

  Pushed by:  wazuh-stack/agent-groups/setup-agent-groups.sh
  Lands at:   /var/ossec/etc/shared/windows/agent.conf  (inside manager)
-->
<agent_config os="windows">

  <!-- ── FIM watch points (Windows file system layout) ─────────── -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>

    <!-- hosts file + system DLLs config -->
    <directories check_all="yes" realtime="yes">%WINDIR%\System32\drivers\etc</directories>

    <!-- Registry hive files (SAM / SECURITY / SOFTWARE / SYSTEM) -->
    <directories check_all="yes" realtime="yes">%WINDIR%\System32\config</directories>

    <!-- App install dirs — shallow only -->
    <directories check_all="yes" recursion_level="0" realtime="yes">C:\Program Files</directories>
    <directories check_all="yes" recursion_level="0" realtime="yes">C:\Program Files (x86)</directories>

    <!-- Startup folders (persistence vector) -->
    <directories check_all="yes" realtime="yes">%USERPROFILE%\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup</directories>
    <directories check_all="yes" realtime="yes">%ALLUSERSPROFILE%\Microsoft\Windows\Start Menu\Programs\StartUp</directories>

    <ignore type="sregex">.log$|.swp$|.tmp$</ignore>
  </syscheck>

  <!-- ── Registry monitoring (Windows-specific) ────────────────── -->
  <syscheck>
    <!-- Run-keys = #1 malware persistence target -->
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run</windows_registry>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\RunOnce</windows_registry>
    <windows_registry arch="both">HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run</windows_registry>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\Software\Microsoft\Windows NT\CurrentVersion\Winlogon</windows_registry>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services</windows_registry>
  </syscheck>

  <!-- ════════════════════════════════════════════════════════════
       Windows Event Logs.
       The "eventchannel" format pulls the modern XML log
       (newer than the legacy "eventlog" format, mandatory for
       channels beyond System/Security/Application).
       ════════════════════════════════════════════════════════════ -->

  <!-- Security: failed logins (4625), privilege use (4672), kerb (4768/9), etc. -->
  <localfile>
    <log_format>eventchannel</log_format>
    <location>Security</location>
    <!-- Drop a few noisy file-share events to keep volume sane -->
    <query>Event/System[EventID != 5145 and EventID != 4658 and EventID != 4690]</query>
  </localfile>

  <localfile>
    <log_format>eventchannel</log_format>
    <location>System</location>
  </localfile>

  <localfile>
    <log_format>eventchannel</log_format>
    <location>Application</location>
  </localfile>

  <!-- PowerShell script block / module logging.
       Requires GPO: "Turn on PowerShell Script Block Logging" + "Module Logging".
       Without those GPOs this channel will be empty but won't error. -->
  <localfile>
    <log_format>eventchannel</log_format>
    <location>Microsoft-Windows-PowerShell/Operational</location>
  </localfile>

  <!-- Sysmon (if installed). Sysmon = EDR-grade process / network / DNS
       telemetry. Highly recommended — install via:
         winget install Sysinternals.Sysmon
         sysmon -accepteula -i C:\sysmonconfig.xml  (use SwiftOnSecurity config)
       Silent / empty if Sysmon is not installed. -->
  <localfile>
    <log_format>eventchannel</log_format>
    <location>Microsoft-Windows-Sysmon/Operational</location>
  </localfile>

  <!-- Windows Defender events -->
  <localfile>
    <log_format>eventchannel</log_format>
    <location>Microsoft-Windows-Windows Defender/Operational</location>
  </localfile>

  <!-- ════════════════════════════════════════════════════════════
       主動掃描 — 命令輸出當 log。
       ════════════════════════════════════════════════════════════ -->

  <localfile>
    <log_format>full_command</log_format>
    <command>netstat -an | findstr LISTENING</command>
    <frequency>300</frequency>
    <alias>listening-ports</alias>
  </localfile>

  <localfile>
    <log_format>full_command</log_format>
    <command>query user</command>
    <frequency>60</frequency>
    <alias>active-users</alias>
  </localfile>

  <!-- 最近開的 process — Sysmon 沒裝時的退路觀察點 -->
  <localfile>
    <log_format>full_command</log_format>
    <command>powershell.exe -Command "Get-Process | Sort-Object StartTime -Descending | Select-Object -First 20 Name,Id,StartTime,Path | Format-List"</command>
    <frequency>300</frequency>
    <alias>recent-processes</alias>
  </localfile>

</agent_config>
